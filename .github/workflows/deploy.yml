name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personastorm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API test suite
        working-directory: apps/api
        env:
          INFERENCE_PROVIDER: mock
          ANALYST_PROVIDER: mock
          PERSONA_SEED: "1337"
        run: python -m pytest tests/ -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        # No backend URL needed at build time — the browser never talks to the
        # FastAPI backend directly. BACKEND_API_BASE is read server-side, at
        # request time, by the /api/backend proxy route (apps/web/app/api/backend).
        run: npm run build

  # Deploys Supabase migrations to the PRODUCTION database. Runs only on a push
  # to main or a manual dispatch — NEVER on pull_request. A PR is unmerged code;
  # letting it push schema changes to production would mutate a shared database
  # from code nobody has approved yet. PR runs get CI (api-tests/web-build) and
  # a Vercel Preview instead — see vercel-preview-deploy below.
  supabase-deploy:
    name: Deploy Supabase migrations
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Supabase migrations
        id: migrations
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -type f -name '*.sql' | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Found Supabase migrations."
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase migration SQL files found. Skipping Supabase deploy."
          fi

      - name: Validate Supabase secrets
        if: steps.migrations.outputs.has_migrations == 'true'
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Supabase CLI
        if: steps.migrations.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase db push

  # Pull requests: deploy a Vercel PREVIEW so reviewers get a live link. This
  # never touches Supabase (see supabase-deploy) and never runs `vercel --prod`.
  vercel-preview-deploy:
    name: Deploy web to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'pull_request'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      # GitHub Actions secrets are the source of truth for Vercel's env, not the
      # Vercel dashboard — this pushes them in on every deploy so the dashboard
      # never silently drifts out of sync (or starts out empty). BACKEND_API_BASE
      # is optional for previews: skip it quietly if unset rather than failing
      # the whole preview deploy — storm/billing/admin just show a clear
      # "not configured" state until a backend exists.
      - name: Sync Vercel environment variables (preview)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
        run: |
          set -eu
          sync_env() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "  - $name: not set (GitHub secret missing) — skipping"
              return 0
            fi
            vercel env rm "$name" preview --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" preview --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null
            echo "  - $name: synced to Vercel (preview)"
          }
          echo "Syncing GitHub secrets into Vercel (preview environment):"
          sync_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          sync_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          sync_env BACKEND_API_BASE "$BACKEND_API_BASE"

      - name: Pull Vercel preview environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Deploy preview to Vercel
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          deployment_url=$(vercel deploy --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG 2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore

  # Push to main / manual dispatch only: deploy the Vercel PRODUCTION build.
  # Waits on supabase-deploy so the database is already migrated before the
  # new frontend (which may depend on new columns/tables) goes live.
  vercel-production-deploy:
    name: Deploy web to Vercel (Production)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, supabase-deploy]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # BACKEND_API_BASE is read server-side by the /api/backend proxy route,
      # never baked into the browser bundle. Production deploys require it —
      # without it every storm/billing/admin action would 503 in production
      # with no way for the deployer to notice until a user hits it. Fail loud
      # here instead. (Login/signup/dashboard don't need it — see
      # docs/deployment.md if you intend to ship the frontend before the
      # backend is deployed and want to bypass this gate.)
      - name: Validate BACKEND_API_BASE (required for production)
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
        run: |
          if [ -z "${BACKEND_API_BASE:-}" ]; then
            echo "Missing required GitHub secret: BACKEND_API_BASE"
            echo "Deploy apps/api first (see apps/api/README.md — Render or Railway), then set"
            echo "BACKEND_API_BASE to the public FastAPI URL, e.g. https://personastorm-api.onrender.com"
            exit 1
          fi

      # Login/signup/dashboard are Supabase-only, but they still need these two
      # to actually authenticate — a production deploy without them ships a
      # site where nobody can log in. Fail loud here rather than silently
      # deploying a broken auth flow.
      - name: Validate Supabase frontend secrets (required for production)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set these from your Supabase project (Settings -> API). Anon key only — never the service role key."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      # GitHub Actions secrets are the source of truth for Vercel's env, not the
      # Vercel dashboard — this pushes them in on every deploy so the dashboard
      # never silently drifts out of sync (or starts out empty, as it did before
      # this step existed). Only these three ever get synced — see the "Never
      # sync" list in docs/deployment.md for what must never appear here.
      - name: Sync Vercel environment variables (production)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
        run: |
          set -eu
          sync_env() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "  - $name: not set (GitHub secret missing) — skipping"
              return 0
            fi
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" production --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null
            echo "  - $name: synced to Vercel (production)"
          }
          echo "Syncing GitHub secrets into Vercel (production environment):"
          sync_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          sync_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          sync_env BACKEND_API_BASE "$BACKEND_API_BASE"

      - name: Pull Vercel production environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Verify production build locally
        working-directory: apps/web
        # NEXT_PUBLIC_SUPABASE_* were already validated above and are now synced
        # into Vercel; `vercel pull` just wrote them to .env.production.local,
        # which `next build` loads automatically — no need to pass them here too.
        run: |
          npm ci
          npm run build

      - name: Deploy web to Vercel production
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          deployment_url=$(vercel deploy --prod --yes --debug --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG 2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore
