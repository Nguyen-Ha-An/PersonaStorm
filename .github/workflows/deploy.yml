name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personastorm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API test suite
        working-directory: apps/api
        env:
          INFERENCE_PROVIDER: mock
          ANALYST_PROVIDER: mock
          PERSONA_SEED: "1337"
        run: python -m pytest tests/ -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        env:
          # Build-time fallback only. Set the real production value in Vercel.
          NEXT_PUBLIC_API_BASE: https://api.example.com
        run: npm run build

  # Deploys Supabase migrations to the PRODUCTION database. Runs only on a push
  # to main or a manual dispatch — NEVER on pull_request. A PR is unmerged code;
  # letting it push schema changes to production would mutate a shared database
  # from code nobody has approved yet. PR runs get CI (api-tests/web-build) and
  # a Vercel Preview instead — see vercel-preview-deploy below.
  supabase-deploy:
    name: Deploy Supabase migrations
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Supabase migrations
        id: migrations
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -type f -name '*.sql' | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Found Supabase migrations."
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase migration SQL files found. Skipping Supabase deploy."
          fi

      - name: Validate Supabase secrets
        if: steps.migrations.outputs.has_migrations == 'true'
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Supabase CLI
        if: steps.migrations.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase db push

  # Pull requests: deploy a Vercel PREVIEW so reviewers get a live link. This
  # never touches Supabase (see supabase-deploy) and never runs `vercel --prod`.
  vercel-preview-deploy:
    name: Deploy web to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'pull_request'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      - name: Pull Vercel preview environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Deploy preview to Vercel
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          deployment_url=$(vercel deploy --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG 2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore

  # Push to main / manual dispatch only: deploy the Vercel PRODUCTION build.
  # Waits on supabase-deploy so the database is already migrated before the
  # new frontend (which may depend on new columns/tables) goes live.
  vercel-production-deploy:
    name: Deploy web to Vercel (Production)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, supabase-deploy]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      - name: Pull Vercel production environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Verify production build locally
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE:-}" ]; then
            echo "::warning title=NEXT_PUBLIC_API_BASE not set::The production frontend needs NEXT_PUBLIC_API_BASE pointing at your deployed FastAPI backend. Set it in Vercel (Settings -> Environment Variables) AND as the NEXT_PUBLIC_API_BASE GitHub secret. Without it the deployed app shows a 'Backend API is not configured' banner. Note: the actual Vercel build uses the value from 'vercel pull', so set it in Vercel too."
          else
            echo "NEXT_PUBLIC_API_BASE is set for the local verification build."
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning title=Supabase frontend env not set::Login/signup need NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY (anon key only — never the service role key). Set them in Vercel (Settings -> Environment Variables). The build still succeeds; the app just shows an 'auth not configured' notice until they are set."
          else
            echo "Supabase frontend env is set for the local verification build."
          fi
          npm ci
          npm run build

      - name: Deploy web to Vercel production
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          deployment_url=$(vercel deploy --prod --yes --debug --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG 2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore
