name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personastorm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  # Canonical production domain used as the default auth-redirect base when the
  # NEXT_PUBLIC_SITE_URL secret is not set. It is a known constant (not a secret),
  # so we default to it rather than failing the deploy — this still guarantees
  # production auth links never fall back to localhost. Set the NEXT_PUBLIC_SITE_URL
  # secret only to override this (e.g. if the domain changes).
  PROD_SITE_URL_DEFAULT: "https://personastorm.nguyenhaan.id.vn"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API test suite
        working-directory: apps/api
        env:
          INFERENCE_PROVIDER: mock
          ANALYST_PROVIDER: mock
          PERSONA_SEED: "1337"
        run: python -m pytest tests/ -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        # PersonaStorm is a Vercel full-stack app: the API is Next.js Route
        # Handlers under apps/web/app/api/*. No external backend URL exists, so
        # nothing backend-related is needed at build time.
        run: npm run build

  # Deploys Supabase migrations to the PRODUCTION database. Runs only on a push
  # to main or a manual dispatch — NEVER on pull_request. A PR is unmerged code;
  # letting it push schema changes to production would mutate a shared database
  # from code nobody has approved yet. PR runs get CI (api-tests/web-build) and
  # a Vercel Preview instead — see vercel-preview-deploy below.
  supabase-deploy:
    name: Deploy Supabase migrations
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Supabase migrations
        id: migrations
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -type f -name '*.sql' | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Found Supabase migrations."
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No Supabase migration SQL files found. Skipping Supabase deploy."
          fi

      - name: Validate Supabase secrets
        if: steps.migrations.outputs.has_migrations == 'true'
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Supabase CLI
        if: steps.migrations.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        if: steps.migrations.outputs.has_migrations == 'true'
        run: supabase db push

  # Pull requests: deploy a Vercel PREVIEW so reviewers get a live link. This
  # never touches Supabase (see supabase-deploy) and never runs `vercel --prod`.
  vercel-preview-deploy:
    name: Deploy web to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build]
    if: github.event_name == 'pull_request'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Vercel CLI
        # Pinned exact version: this job holds deploy + Supabase secrets, so an
        # unpinned "latest" CLI is a supply-chain risk. Bump deliberately via PR.
        run: npm install --global vercel@54.20.1

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      # GitHub Actions secrets are the source of truth for Vercel's env, not the
      # Vercel dashboard — this pushes them in on every deploy so the dashboard
      # never silently drifts out of sync (or starts out empty). Values are only
      # ever piped via stdin (never echoed); the loop prints names only. Vars
      # that are unset are skipped quietly. SUPABASE_URL falls back to
      # NEXT_PUBLIC_SUPABASE_URL (the project URL is not a secret). The secrets
      # that must NEVER be synced to Vercel — SUPABASE_DB_PASSWORD,
      # SUPABASE_ACCESS_TOKEN, VERCEL_TOKEN, ADMIN_PASSWORD — are simply not
      # listed here.
      - name: Sync Vercel environment variables (preview)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          INFERENCE_PROVIDER: ${{ secrets.INFERENCE_PROVIDER }}
          ANALYST_PROVIDER: ${{ secrets.ANALYST_PROVIDER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        run: |
          set -eu
          sync_env() {
            name="$1"; value="$2"; target="$3"
            if [ -z "$value" ]; then
              echo "  - $name: not set (GitHub secret missing) — skipping"
              return 0
            fi
            vercel env rm "$name" "$target" --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" "$target" --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null
            echo "  - $name: synced to Vercel ($target)"
          }
          echo "Syncing GitHub secrets into Vercel (preview environment):"
          sync_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL" preview
          sync_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY" preview
          sync_env NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL" preview
          sync_env SUPABASE_URL "${SUPABASE_URL:-$NEXT_PUBLIC_SUPABASE_URL}" preview
          sync_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" preview
          sync_env SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET" preview
          sync_env INFERENCE_PROVIDER "$INFERENCE_PROVIDER" preview
          sync_env ANALYST_PROVIDER "$ANALYST_PROVIDER" preview
          sync_env NVIDIA_API_KEY "$NVIDIA_API_KEY" preview
          sync_env NVIDIA_BASE_URL "$NVIDIA_BASE_URL" preview
          sync_env NVIDIA_MODEL "$NVIDIA_MODEL" preview

      - name: Pull Vercel preview environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Deploy preview to Vercel
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          # Bake a build marker into the deployed bundle so /api/debug/auth-config
          # can prove WHICH commit is live (detects a stale Vercel build). These
          # are non-secret NEXT_PUBLIC_* build args, inlined at build time.
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deployment_url=$(vercel deploy --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG \
            --build-env NEXT_PUBLIC_COMMIT_SHA="${GITHUB_SHA}" \
            --build-env NEXT_PUBLIC_DEPLOYED_AT="${DEPLOYED_AT}" \
            2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore
          # Raw CLI output could one day include sensitive values we don't
          # control — keep the debugging window short.
          retention-days: 7

  # Push to main / manual dispatch only: deploy the Vercel PRODUCTION build.
  # Waits on supabase-deploy so the database is already migrated before the
  # new frontend (which may depend on new columns/tables) goes live.
  vercel-production-deploy:
    name: Deploy web to Vercel (Production)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, supabase-deploy]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # PersonaStorm is a Vercel full-stack app — there is no external backend
      # and no BACKEND_API_BASE to validate. A production deploy needs the
      # Supabase FRONTEND secrets (so users can log in) and the Supabase SERVER
      # secrets (so the Route Handlers can verify tokens and own wallet
      # mutations). Fail loud if any are missing rather than shipping a broken
      # deploy. NVIDIA_* are optional (mock provider is the default).
      - name: Validate required Supabase secrets (production)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # NEXT_PUBLIC_SITE_URL is intentionally NOT required here: it defaults to
          # PROD_SITE_URL_DEFAULT (the known production domain) below, so a missing
          # secret must not block the deploy.
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the frontend keys from Supabase Settings -> API (anon key only, never the service role)."
            echo "Set SUPABASE_SERVICE_ROLE_KEY (server-side only) so Route Handlers can own wallet mutations."
            exit 1
          fi

      # Auth redirects break silently if NEXT_PUBLIC_SITE_URL is localhost or the
      # Supabase URL carries an API path — validate both before we ship. Values
      # are passed via env and never echoed; only names/verdicts are printed.
      - name: Validate auth redirect + Supabase URL format (production)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NODE_ENV: production
        run: |
          node - <<'NODE'
          function fail(msg) { console.error(msg); process.exit(1); }

          // Fall back to the known production domain when the secret is unset, so
          // the deploy is never blocked and production still never uses localhost.
          const site = process.env.NEXT_PUBLIC_SITE_URL || process.env.PROD_SITE_URL_DEFAULT;
          if (!site) fail("No NEXT_PUBLIC_SITE_URL and no PROD_SITE_URL_DEFAULT.");
          if (!process.env.NEXT_PUBLIC_SITE_URL) {
            console.log("NEXT_PUBLIC_SITE_URL secret unset — defaulting to PROD_SITE_URL_DEFAULT.");
          }
          let siteUrl;
          try {
            siteUrl = new URL(site);
          } catch {
            fail("NEXT_PUBLIC_SITE_URL is not a valid URL.");
          }
          if (siteUrl.protocol !== "https:") {
            fail("NEXT_PUBLIC_SITE_URL must use https in production.");
          }
          if (
            process.env.NODE_ENV === "production" &&
            (siteUrl.hostname === "localhost" || siteUrl.hostname === "127.0.0.1")
          ) {
            fail("NEXT_PUBLIC_SITE_URL cannot be localhost in production.");
          }

          const supa = process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (!supa) fail("Missing required secret: NEXT_PUBLIC_SUPABASE_URL");
          let supaUrl;
          try {
            supaUrl = new URL(supa);
          } catch {
            fail("NEXT_PUBLIC_SUPABASE_URL is not a valid URL.");
          }
          if (supaUrl.protocol !== "https:") {
            fail("NEXT_PUBLIC_SUPABASE_URL must use https.");
          }
          // Must be ONLY the project origin — no /rest/v1, /auth/v1, /storage/v1.
          const path = supaUrl.pathname.replace(/\/$/, "");
          if (path !== "") {
            fail(
              "NEXT_PUBLIC_SUPABASE_URL must be only https://<project-ref>.supabase.co " +
                "(no /rest/v1, /auth/v1, or /storage/v1 path).",
            );
          }
          console.log("Auth redirect + Supabase URL format OK.");
          NODE

      - name: Install Vercel CLI
        # Pinned exact version: this job holds deploy + Supabase secrets, so an
        # unpinned "latest" CLI is a supply-chain risk. Bump deliberately via PR.
        run: npm install --global vercel@54.20.1

      - name: Prepare Vercel scope argument
        run: |
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            echo "VERCEL_SCOPE_ARG=--scope ${VERCEL_SCOPE}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_SCOPE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Create Vercel project link
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"orgId":"${VERCEL_ORG_ID}","projectId":"${VERCEL_PROJECT_ID}"}
          EOF
          echo "Linked Vercel project in apps/web/.vercel/project.json"

      # GitHub Actions secrets are the source of truth for Vercel's env, not the
      # Vercel dashboard — this pushes them in on every deploy so the dashboard
      # never silently drifts out of sync (or starts out empty). Values are only
      # ever piped via stdin (never echoed); the loop prints names only.
      # NEVER-SYNC list (deliberately absent below): SUPABASE_DB_PASSWORD,
      # SUPABASE_ACCESS_TOKEN, VERCEL_TOKEN, ADMIN_PASSWORD. Public NEXT_PUBLIC_*
      # keys and server-side SUPABASE_*/NVIDIA_* are synced; SUPABASE_URL falls
      # back to NEXT_PUBLIC_SUPABASE_URL. Server-side vars must NOT be prefixed
      # with NEXT_PUBLIC_ (they are not, here or in the app).
      - name: Sync Vercel environment variables (production)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          INFERENCE_PROVIDER: ${{ secrets.INFERENCE_PROVIDER }}
          ANALYST_PROVIDER: ${{ secrets.ANALYST_PROVIDER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          # Optional: gates the /api/debug/auth-config endpoint in production.
          # If unset, that endpoint stays disabled (404) — safe default.
          AUTH_DEBUG_SECRET: ${{ secrets.AUTH_DEBUG_SECRET }}
        run: |
          set -eu
          sync_env() {
            name="$1"; value="$2"; target="$3"
            if [ -z "$value" ]; then
              echo "  - $name: not set (GitHub secret missing) — skipping"
              return 0
            fi
            vercel env rm "$name" "$target" --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" "$target" --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG >/dev/null
            echo "  - $name: synced to Vercel ($target)"
          }
          echo "Syncing GitHub secrets into Vercel (production environment):"
          sync_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL" production
          sync_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY" production
          sync_env NEXT_PUBLIC_SITE_URL "${NEXT_PUBLIC_SITE_URL:-$PROD_SITE_URL_DEFAULT}" production
          sync_env SUPABASE_URL "${SUPABASE_URL:-$NEXT_PUBLIC_SUPABASE_URL}" production
          sync_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" production
          sync_env SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET" production
          sync_env AUTH_DEBUG_SECRET "$AUTH_DEBUG_SECRET" production
          sync_env INFERENCE_PROVIDER "$INFERENCE_PROVIDER" production
          sync_env ANALYST_PROVIDER "$ANALYST_PROVIDER" production
          sync_env NVIDIA_API_KEY "$NVIDIA_API_KEY" production
          sync_env NVIDIA_BASE_URL "$NVIDIA_BASE_URL" production
          sync_env NVIDIA_MODEL "$NVIDIA_MODEL" production

      - name: Pull Vercel production environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG

      - name: Verify production build locally
        working-directory: apps/web
        # NEXT_PUBLIC_SUPABASE_* were already validated above and are now synced
        # into Vercel; `vercel pull` just wrote them to .env.production.local,
        # which `next build` loads automatically — no need to pass them here too.
        run: |
          npm ci
          npm run build

      - name: Deploy web to Vercel production
        id: deploy
        working-directory: apps/web
        run: |
          set -o pipefail
          # Bake a build marker into the deployed bundle so /api/debug/auth-config
          # can prove WHICH commit is live (detects a stale Vercel build). These
          # are non-secret NEXT_PUBLIC_* build args, inlined at build time.
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deployment_url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" $VERCEL_SCOPE_ARG \
            --build-env NEXT_PUBLIC_COMMIT_SHA="${GITHUB_SHA}" \
            --build-env NEXT_PUBLIC_DEPLOYED_AT="${DEPLOYED_AT}" \
            2>&1 | tee vercel-deploy.log | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vercel deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-log
          path: apps/web/vercel-deploy.log
          if-no-files-found: ignore
          # Raw CLI output could one day include sensitive values we don't
          # control — keep the debugging window short.
          retention-days: 7
